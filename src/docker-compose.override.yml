services:
  lyra.db:
    container_name: lyra.db
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=SwN12345678
      - MSSQL_PID=Express
    restart: always
    networks:
      - gloria-net
    ports:
      - "1434:1433"
    volumes:
      - "./data/:/var/opt/mssql/data/"
      - "./log/:/var/opt/mssql/log/"
      - "./secrets/:/var/opt/mssql/secrets/"

  lyra.server:
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=8080
      - ASPNETCORE_HTTPS_PORTS=8081
      - ConnectionStrings__Database=Server=lyra.db;Database=LYRA_Db;User Id=sa;Password=SwN12345678;Encrypt=False;TrustServerCertificate=True
      - ConnectionStrings__CachedDatabase=Server=lyra.db;Database=LYRA_CachedDb;User Id=sa;Password=SwN12345678;Encrypt=False;TrustServerCertificate=True
      - ConnectionStrings__LogsDatabase=Server=lyra.db;Database=LYRA_LogsDb;User Id=sa;Password=SwN12345678;Encrypt=False;TrustServerCertificate=True
    networks:
      - gloria-net
    depends_on:
      - lyra.db
    ports:
      - "6020:8080"
      - "6021:8081"
    volumes:
      - ${APPDATA}/Microsoft/UserSecrets:/home/app/.microsoft/usersecrets:ro
      - ${APPDATA}/Microsoft/UserSecrets:/root/.microsoft/usersecrets:ro
      - ${APPDATA}/ASP.NET/Https:/home/app/.aspnet/https:ro
      - ${APPDATA}/ASP.NET/Https:/root/.aspnet/https:ro